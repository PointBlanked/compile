name: swift-ci

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-test:
    name: Build + unit tests (macOS host)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build -c debug
      - name: Test (includes frame-delta benchmark)
        run: swift test --parallel
      - name: Release build (optimizer catches different issues)
        run: swift build -c release
      - name: Benchmarks (real engine code, this runner)
        run: |
          swift run -c release EchoGuideBench
          {
            echo "> **CI runners are virtual Macs without Neural Engine or GPU acceleration for Vision**, so the vision rows here run roughly 15x slower than on real Apple silicon. This job is a regression check (correctness, skip rate, decision cost), not a speed claim. Speed claims come from real hardware: see benchmarks/results in the repo and the in-app speed test."
            echo
            cat benchmarks/results/*.md
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/results/

  ios-build:
    name: Compile iOS paths (ARKit, CoreHaptics, camera)
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build for iOS Simulator
        run: |
          # SwiftPM schemes are named after the checkout folder; pick the package scheme.
          SCHEME=$(xcodebuild -list -json | python3 -c 'import json,sys; s=json.load(sys.stdin)["workspace"]["schemes"]; print(next((x for x in s if x.endswith("-Package")), s[0]))')
          echo "Using scheme: $SCHEME"
          xcodebuild build \
            -scheme "$SCHEME" \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO | tail -n 40
          exit ${PIPESTATUS[0]}

  app-build:
    name: Build the iOS app (EchoGuideApp)
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build app for iOS Simulator
        run: |
          status=0
          xcodebuild build \
            -project EchoGuideApp/EchoGuideApp.xcodeproj \
            -scheme EchoGuideApp \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1 || status=$?
          grep -E "error:|warning: .*will be an error" build.log | sort -u | head -60 || true
          tail -n 15 build.log
          exit $status

  proxy-test:
    name: Proxy tests (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        working-directory: proxy
        run: node --test
